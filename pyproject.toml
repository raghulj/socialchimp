[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialchimp"
dynamic = ["version"]
description = "One simple way to connect your app to social networks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Raghul Jagannathan", email = "raghulj@gmail.com" }]
keywords = [
    "social",
    "mastodon",
    "bluesky",
    "instagram",
    "youtube",
    "tiktok",
    "twitter",
    "pinterest",
    "threads",
    "oauth",
    "django",
    "fastapi",
    "flask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# For people writing their own platform: the checks that prove it behaves
# like the built-in ones. See docs/adding-a-platform.md
testing = ["pytest>=8.3"]

# One line per network. Mastodon needs nothing beyond httpx, so its list is
# empty - but the extra exists so that the command we print in error
# messages, pip install "socialchimp[mastodon]", actually works.
mastodon = []
bluesky = []
facebook = []
instagram = []
pinterest = []
threads = []
tiktok = []
x = []
youtube = []
django = ["django>=4.2"]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3.0"]

[project.urls]
Homepage = "https://github.com/raghulj/socialchimp"
Documentation = "https://github.com/raghulj/socialchimp/tree/main/docs"
Issues = "https://github.com/raghulj/socialchimp/issues"

# Platforms that ship with socialchimp register themselves here.
# Anyone can publish their own package that adds to this same list.
# See docs/adding-a-platform.md
# Platforms register themselves here as they land. Each line is added in
# the same commit as the platform it names, so this never promises something
# that is not installed yet.
[project.entry-points."socialchimp.platforms"]
mastodon = "socialchimp.platforms.mastodon:MastodonPlatform"
bluesky = "socialchimp.platforms.bluesky:BlueskyPlatform"
facebook = "socialchimp.platforms.facebook:FacebookPlatform"
instagram = "socialchimp.platforms.instagram:InstagramPlatform"
pinterest = "socialchimp.platforms.pinterest:PinterestPlatform"
threads = "socialchimp.platforms.threads:ThreadsPlatform"
tiktok = "socialchimp.platforms.tiktok:TikTokPlatform"
x = "socialchimp.platforms.x:XPlatform"
youtube = "socialchimp.platforms.youtube:YouTubePlatform"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

# The documentation site. Kept out of `dev` so `uv sync --all-extras --dev`
# does not pull a static site generator into every contributor's environment
# - only `uv sync --group docs` (or `--group docs` on a single command) does.
# See mkdocs.yml and .github/workflows/docs.yml.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.version]
path = "src/socialchimp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/socialchimp"]

# ---------------------------------------------------------------------------
# Tests. Coverage must be 100% - see docs/PLAN.md for why we hold this line.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=socialchimp",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["src/socialchimp"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # Protocol method bodies
]
show_missing = true

# ---------------------------------------------------------------------------
# Types. Everything is typed. No exceptions, no untyped escape hatches.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "examples", "docs"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
extra_checks = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
]

# ---------------------------------------------------------------------------
# Style and lint.
# ---------------------------------------------------------------------------
# Django ships no type information, so a file that subclasses models.Model
# cannot pass the settings above. The library itself does not need this - it
# names the four Django things it uses as protocols and stays strict - but an
# example is meant to look like the Django somebody would really write.
#
# This is the only place in the project where strictness is turned down, it
# covers examples rather than shipped code, and everything not coming from
# Django is still checked.
#
# `import-untyped` is off for the same one reason and no other: with no
# py.typed and no bundled stubs, `from django.db import models` is an import
# mypy cannot follow, and that is reported at the import itself - so turning
# the code off here turns it off only in these files. Everything socialchimp
# hands these examples is typed and stays checked.
#
# The names after the first are the Django project in examples/django_project,
# spelt the way mypy sees it rather than the way the folder is laid out: a
# Django project is not itself an importable package, so mypy names each file
# from the nearest directory that has an __init__.py - `social.views`,
# `socialsite.settings`, and `manage` on its own.
[[tool.mypy.overrides]]
module = [
    "examples.facebook_django.*",
    "manage",
    "social.*",
    "socialsite.*",
]
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # modern python syntax
    "B",         # likely bugs
    "A",         # shadowing builtins
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetimes only
    "T20",       # no stray print()
    "SIM",       # simplifications
    "PTH",       # pathlib over os.path
    "RUF",       # ruff's own rules
    "ASYNC",     # async mistakes
    "S",         # security
    "D",         # docstrings
    "ANN",       # type annotations
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",         # assert is the point of a test
    "S105", "S106", # fake secrets in fixtures are not real secrets
    "D",            # test names are the documentation
]
"examples/*" = [
    "T201",    # examples print things on purpose
    "D",       # examples are documentation already
]

[tool.ruff.lint.pydocstyle]
convention = "google"
